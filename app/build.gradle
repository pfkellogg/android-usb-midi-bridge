plugins {
    id "com.android.application"
}

android {
    namespace "com.fm1.midibridge"
    compileSdk 34

    defaultConfig {
        applicationId "com.fm1.midibridge"
        minSdk 29
        targetSdk 34
        versionCode 30
        versionName "1.30"
        manifestPlaceholders = [appLabel: "MIDI Bridge"]
    }

    // oss  = the free bridge, built from this public repo alone.
    // play = the Google Play build: bridge + Pro singing tuner, whose source lives in
    //        ../pro (a separate private repo, git-ignored here).
    // firetv = the free bridge for Fire TV sticks (Fire OS 6 = Android 7.1): lower
    //        minSdk plus a TV launcher entry (src/firetv).
    flavorDimensions = ["dist"]
    productFlavors {
        oss { dimension "dist" }
        play { dimension "dist" }
        firetv {
            dimension "dist"
            minSdk 25
            applicationIdSuffix ".firetv"  // own ID: the Fire TV Appstore never re-makes a sideloaded app's tile picture
            versionCode 40  // bumped so Fire OS drops its cached launcher icon
            versionNameSuffix "-firetv"
            versionName "1.37"  // new name too: the Your Apps grid caches icons by it
            manifestPlaceholders = [appLabel: "AIKellogg MIDI Bridge: Notes, Chords & Staff — for Fire TV Stick 4K (Android Fire OS, not Vega OS)"]
        }
    }
    sourceSets {
        play {
            java.srcDirs += ["../pro/java"]
            manifest.srcFile "../pro/AndroidManifest.xml"
            assets.srcDirs += ["../pro/assets"]  // the backing-track sound bank (~32 MB)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
